        <h1 class="projects-heading">CONTACT</h1>
        <p class="contact-intro"> This page will provide information on how to contact me for any collaborations or questions you may have. Feel free to reach out through the provided forms.
        </p>
        <hr>

        <div class="contact-info">
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="First and Last Name" required>

                <label for="email">Subject:</label>
                <input type="text" id="contact-subject" name="subject" placeholder="Subject" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Message..." rows="5" required></textarea>

                <button type="submit">Send</button>
            </form>
            <div class="contact-logos">
                <h2> Other Platforms:</h2>
                    <a href="https://www.linkedin.com/in/ritvik-grandhi/" target="_blank">
                        <img src="pictures/linkedin.png" style="width: 100px; height: auto"></img>
                    </a>
                    <a href="https://github.com/ritvikgrandhi" target="_blank">
                        <img src="pictures/github.png" style="width: 100px; height: auto"></img>
                    </a>
                    <a href="https://www.instagram.com/ritvikgrandhi/" target="_blank">
                        <img src="pictures/insta.png" style="width: 100px; height: auto"></img>
                    </a>
